; Dense island foliage requires more surface-cache pages than the engine's
; default Epic budget. Lower presets retain their engine budgets. This keeps
; real foliage GI and all overflow diagnostics enabled; validate on 8 GB GPUs.
[GlobalIlluminationQuality@3]
; Normal driving exceeded the 5632 preview by 12.34% in the middle forest.
; 50 pages add 29% capacity over that preview; retain native VRAM diagnostics.
r.LumenScene.SurfaceCache.AtlasSize=6400

; Native garage906 isolates diffuse skylight sampling variance. Keep the same
; rays per frame and retain screen traces, AO, GI, shadows and authored lighting.
; Match the accumulated history with a larger set of independent ray directions.
; Motion/disocclusion and Day/Sunset/Night acceptance are required before delivery.
r.Lumen.ScreenProbeGather.Temporal.MaxFramesAccumulated=64
r.Lumen.ScreenProbeGather.Temporal.MaxRayDirections=64

; Keep detailed dynamic shadows without the default Epic 2.8x directional
; oversampling of every moving leaf. Validate the native forest and night routes.
[ShadowQuality@3]
r.Shadow.Virtual.ResolutionLodBiasDirectional=-0.5
r.Shadow.Virtual.ResolutionLodBiasDirectionalMoving=-0.5
