[SystemSettings]
; Native PIE and frozen water-only comparisons 29/30: SSR + live sky reduces
; the Lumen grazing-view striping. Offscreen object coverage remains limited;
; source below-sea hit rejection is not reproduced by this renderer path.
; West Lake (WL): forced SSR fell back to sky wherever a reflected ray left the screen - big cyan
; blotches over the lake. Lumen reflections (same as the scene) reflect the off-screen shores.
r.Water.SingleLayer.Reflection=1
; The Epic scalability preset capped the texture streaming pool at 1000 MB,
; so the marina view streamed low mips and logged "video memory exhausted"
; on an 8 GB GPU. 3500 MB fits 8 GB; the VRAM limit keeps smaller GPUs safe.
r.Streaming.PoolSize=3500
r.Streaming.LimitPoolSizeToVRAM=1
; West Lake perf pass: the default Lumen surface cache atlas allocated ~1.5 GB of lighting atlases
; and pushed the 8 GB laptop GPU over its memory budget ("video memory exhausted", heavy stutter).
; 2048 cut resident GPU memory 7976 -> 6360 MB with no visible change in the lake / landmark views.
r.LumenScene.SurfaceCache.AtlasSize=2560
; ...and 60 card texels per metre (default 100) so the West Lake scene fits that atlas (80 fitted the lake alone; the
; city, scenic spots and the lit residence interior oversubscribed it again, so the atlas is 2560 now).
r.LumenScene.SurfaceCache.CardTexelDensityScale=60

